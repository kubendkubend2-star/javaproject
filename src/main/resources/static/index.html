<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f1">
  <title>Fieldwise | Tele-veterinary care</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#dashboard" data-view="dashboard" aria-label="Fieldwise dashboard">
        <span class="brand-mark">F<span>+</span></span>
        <span class="brand-copy"><strong>fieldwise</strong><small>VETERINARY NETWORK</small></span>
      </a>
      <div class="nav-caption">WORKSPACE</div>
      <nav class="nav-list">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◫</span>Overview</button>
        <button class="nav-item" data-view="consultations"><span class="nav-icon">✳</span>Consultations</button>
        <button class="nav-item" data-view="livestock"><span class="nav-icon">♧</span>Livestock</button>
        <button class="nav-item" data-view="farmers"><span class="nav-icon">♙</span>Farmers</button>
        <button class="nav-item" data-view="specialists"><span class="nav-icon">✚</span>Specialists</button>
        <button class="nav-item" data-view="vendors"><span class="nav-icon">▤</span>Vendors</button>
      </nav>
      <div class="sidebar-foot">
        <div class="network-status"><span class="status-dot"></span><span><strong>Network online</strong><small>Regional hub · Mysuru</small></span></div>
        <label class="role-picker"><span>DEMO ROLE</span>
          <select id="role-select" aria-label="Demo role">
            <option value="ADMIN">Health Director</option>
            <option value="INVOICING_USER">Veterinary Accountant</option>
            <option value="FARMER">Livestock Farmer</option>
          </select>
        </label>
        <div class="profile"><span class="avatar">AR</span><span><strong>Admin account</strong><small>Regional operations</small></span><span class="profile-more">···</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-divider">/</span><strong id="crumb-current">Overview</strong></div>
        <div class="top-actions"><span class="today-label" id="today-label"></span><span class="top-avatar">AR</span></div>
      </header>
      <section id="content" class="page-content" aria-live="polite"></section>
    </main>
  </div>
  <dialog id="record-dialog" class="record-dialog">
    <form id="record-form" method="dialog">
      <div class="dialog-head"><div><p class="eyebrow" id="dialog-eyebrow">RECORD</p><h2 id="dialog-title">Add record</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="Close">×</button></div>
      <div id="form-fields" class="form-grid"></div>
      <div class="dialog-actions"><button type="button" class="button button-quiet" id="cancel-dialog">Cancel</button><button class="button button-primary" id="save-button" type="submit">Save record</button></div>
    </form>
  </dialog>
  <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
</body>
</html>
